<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bible Scroll">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
  <title>Bible Scroll</title>
</head>
<body>
  <main id="feed" class="feed" aria-live="polite"></main>
  <p id="loading" class="loading">Loading…</p>

  <div id="rail" class="rail" aria-label="Verses in this chapter" hidden>
    <div id="railTrack" class="rail-track"></div>
    <span id="railNumber" class="rail-number"></span>
  </div>
  <p id="railLabel" class="rail-label" hidden></p>

  <header class="topbar">
    <div class="pill">
      <button id="favouritesButton" class="pill-icon" aria-label="Favourites">
        <svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.1A4.4 4.4 0 0 1 12 7a4.4 4.4 0 0 1 7.5 2.9C19.5 15.4 12 20 12 20Z"/></svg>
      </button>
      <button id="bookmarksButton" class="pill-icon" aria-label="Bookmarks">
        <svg viewBox="0 0 24 24"><path d="M6.5 4h11v16l-5.5-4-5.5 4Z"/></svg>
      </button>
    </div>
    <span class="spacer"></span>
    <button id="bookmarkToggle" class="round verse-only" aria-label="Bookmark this verse" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M6.5 4h11v16l-5.5-4-5.5 4Z"/></svg>
    </button>
    <button id="jumpButton" class="pill chapter-pill" aria-label="Jump to a chapter">
      <span id="chapterLabel"></span>
      <svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg>
    </button>
  </header>

  <nav class="actions verse-only" aria-label="Verse actions">
    <button id="favouriteToggle" class="action heart" aria-label="Favourite" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.1A4.4 4.4 0 0 1 12 7a4.4 4.4 0 0 1 7.5 2.9C19.5 15.4 12 20 12 20Z"/></svg>
    </button>
    <button id="reflectButton" class="action" aria-label="Reflections">
      <svg viewBox="0 0 24 24"><path d="M12 4c4.7 0 8.5 3.3 8.5 7.4s-3.8 7.4-8.5 7.4c-1.1 0-2.2-.2-3.2-.5L4.5 20l1.2-3.7A7 7 0 0 1 3.5 11.4C3.5 7.3 7.3 4 12 4Z"/></svg>
      <span id="reflectCount" class="action-count"></span>
    </button>
    <button id="shareButton" class="action" aria-label="Share">
      <svg viewBox="0 0 24 24"><path d="M20.5 3.5 3.5 10.5l7 3 3 7Zm0 0-10 10"/></svg>
    </button>
    <button id="studyButton" class="action" aria-label="Study">
      <svg viewBox="0 0 24 24"><circle class="dot" cx="5.5" cy="12" r="1.2"/><circle class="dot" cx="12" cy="12" r="1.2"/><circle class="dot" cx="18.5" cy="12" r="1.2"/></svg>
    </button>
  </nav>

  <p id="toast" class="toast" hidden></p>

  <dialog id="timeline" class="sheet">
    <div class="sheet-inner">
      <header class="sheet-header">
        <button class="text-button" data-close>Close</button>
        <h2 id="timelineTitle"></h2>
        <span></span>
      </header>
      <div class="sheet-body">
        <blockquote id="timelineVerse" class="verse-card"></blockquote>
        <p id="timelineCount" class="section-label"></p>
        <ul id="timelineList" class="card-list"></ul>
      </div>
      <form id="composer" class="composer">
        <textarea id="composerText" rows="1" placeholder="What does this verse say to you today?"></textarea>
        <button id="composerSend" class="send" type="submit" aria-label="Save" disabled>
          <svg viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
        </button>
      </form>
    </div>
  </dialog>

  <dialog id="study" class="sheet half">
    <div class="sheet-inner">
      <header class="sheet-header">
        <span></span>
        <h2 id="studyTitle"></h2>
        <button class="text-button" data-close>Done</button>
      </header>
      <div class="sheet-body">
        <ul id="studyLinks" class="card-list links"></ul>
        <div id="debugSection" hidden>
          <p class="section-label">Debug</p>
          <ul class="card-list links">
            <li><button id="seedButton">Seed 500 reflections</button></li>
            <li><button id="wipeButton" class="destructive">Delete all reflections</button></li>
          </ul>
        </div>
      </div>
    </div>
  </dialog>

  <dialog id="saved" class="sheet">
    <div class="sheet-inner">
      <header class="sheet-header">
        <span></span>
        <h2>Saved</h2>
        <button class="text-button" data-close>Done</button>
      </header>
      <div class="sheet-body">
        <div id="savedTabs" class="segmented">
          <button data-kind="favourite">Favourites</button>
          <button data-kind="bookmark">Bookmarks</button>
        </div>
        <ul id="savedList" class="card-list saved-list"></ul>
        <p id="savedEmpty" class="empty-note" hidden></p>
      </div>
    </div>
  </dialog>

  <dialog id="jump" class="sheet tall">
    <div class="sheet-inner">
      <header class="sheet-header">
        <button id="jumpBack" class="text-button" hidden>‹ Books</button>
        <h2 id="jumpTitle">Books</h2>
        <button class="text-button" data-close>Done</button>
      </header>
      <div id="bookView" class="sheet-body">
        <input id="bookSearch" class="search" type="search" placeholder="Book name" autocomplete="off" autocorrect="off" spellcheck="false">
        <div id="testaments" class="segmented">
          <button data-testament="old">Old Testament</button>
          <button data-testament="new">New Testament</button>
        </div>
        <ul id="bookList" class="card-list links"></ul>
        <p class="attribution">The Holy Bible, Berean Standard Bible (BSB), dedicated to the public domain.</p>
      </div>
      <div id="chapterView" class="sheet-body" hidden>
        <div id="chapterGrid" class="chapter-grid"></div>
      </div>
    </div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
